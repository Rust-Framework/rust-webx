[package]
name = "rust-webx-idempotency-ef"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
publish = false
description = "Durable Idempotency-Key store for rust-webx, backed by rust-ef"
readme = "README.md"
keywords = ["web", "orm", "idempotency", "rust-ef"]
categories = ["web-programming", "database"]

[lib]
name = "rust_webx_idempotency_ef"

[dependencies]
rust-webx-core.workspace = true
rust-ef.workspace = true
async-trait.workspace = true
sha2.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
# Optional real-database providers, only needed by the env-driven `#[ignore]`
# tests (`cargo test -p rust-webx-idempotency-ef --features postgres,mysql -- --ignored`).
rust-ef-postgres = { workspace = true, optional = true }
rust-ef-mysql = { workspace = true, optional = true }

[dev-dependencies]
rust-ef-sqlite.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
postgres = ["dep:rust-ef-postgres"]
mysql = ["dep:rust-ef-mysql"]

[lints]
workspace = true
