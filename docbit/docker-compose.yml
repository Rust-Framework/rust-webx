# Local production-like stack for docbit (SQLite).
# Usage (from repo root):
#   cp docbit/.env.example docbit/.env   # edit JWT_SECRET
#   docker compose -f docbit/docker-compose.yml --env-file docbit/.env up --build

services:
  docbit:
    build:
      context: ..
      dockerfile: docbit/Dockerfile
    restart: unless-stopped
    ports:
      - "${DOCBIT_PORT:-8100}:8100"
    environment:
      APP_ENV: Production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in docbit/.env (min 32 chars)}
      APP__App__Urls: '["http://0.0.0.0:8100"]'
    volumes:
      - docbit_data:/app
      - docbit_docs:/app/docs

volumes:
  docbit_data:
  docbit_docs:
