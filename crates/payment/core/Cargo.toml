[package]
name = "rust-webx-pay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
description = "Provider-neutral payment ports, models and webhook ingress for rust-webx (Stripe, Alipay, WeChat Pay, PayPal, Adyen, Square)"
readme = "../../../README.md"
keywords = ["web", "payment", "stripe", "alipay", "wechatpay"]
