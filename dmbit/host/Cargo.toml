[package]
name = "dmbit-host"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
name = "dmbit_host"
path = "src/lib.rs"

[[bin]]
name = "dmbit-host"
path = "src/main.rs"

[dependencies]
dmbit-contracts.workspace = true
dmbit-domain.workspace = true
dmbit-handlers.workspace = true
rust-ef.workspace = true
rust-ef-sqlite.workspace = true
rust-webx.workspace = true
rust-dix.workspace = true
async-trait.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
bcrypt = "0.16"
inventory.workspace = true

[dev-dependencies]
rust-webx = { workspace = true, features = ["testing"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }
serde_json.workspace = true
serial_test = "3"
