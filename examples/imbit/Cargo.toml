# imbit — real-time IM reference service (HTTP + WebSocket).
#
# Four-layer rust-xazgo layout: contracts (requests, routes, read models,
# WebSocket protocol) → domain (aggregates, typed errors, in-process
# repositories, mappers) → handlers (one operation per file) → host
# (composition root: configuration, DI, WebSocket registration).
[workspace]
resolver = "2"

members = ["contracts", "domain", "handlers", "host"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
authors = ["Start"]
homepage = "https://rust-framework.github.io/rust-webx/"
repository = "https://github.com/Rust-Framework/rust-webx"
documentation = "https://docs.rs/rust-webx"

[workspace.dependencies]
# Framework crates (this repository).
rust-webx-core = { version = "=2.9.3", path = "../../crates/core" }
rust-webx = { version = "=2.9.3", path = "../../crates/webx" }

# imbit sub-crates (innermost first).
imbit-contracts = { version = "0.1.0", path = "contracts" }
imbit-domain = { version = "0.1.0", path = "domain" }
imbit-handlers = { version = "0.1.0", path = "handlers" }

# DI + shared contracts (sibling RF checkouts while the 1.x line is unpublished).
rust-dix = "1.0"
rust-core = "0.1"

# External dependencies.
async-trait = "0.1"
data-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake", "stream", "connect"] }

