[package]
name = "rust-webx-nats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "NATS event transport for rust-webx (ASP.NET Core style add_nats)"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../../../README.md"
keywords = ["nats", "events", "messaging", "webx", "aspnet-core"]
categories = ["web-programming", "asynchronous"]

[lib]
name = "webx_nats"

[dependencies]
rust-webx-core.workspace = true
rust-webx-host.workspace = true
rust-dix.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
futures-util.workspace = true
serde.workspace = true
tracing.workspace = true
async-nats.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
rust-webx-contract-tests = { path = "../../contract-tests" }
inventory.workspace = true

[lints]
workspace = true
