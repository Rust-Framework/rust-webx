[workspace]
resolver = "2"

members = [
    "crates/core",
    "crates/host",
    "crates/engine",
    "crates/macros",
    "crates/webx",
    "crates/spa",
    "crates/build",
    "crates/openapi",
    # Transactional-outbox contract + dispatcher + in-memory store. The durable
    # store and the producer-side enqueue helper live in the unpublished
    # reference adapter (`examples/adapters/outbox/ef`), so this crate never
    # links an ORM.
    "crates/outbox",
    # Bounded domain groups: new adapters go under the existing group instead
    # of adding another top-level `crates/<vendor>` entry. Enforced by
    # scripts/check-crate-layout.sh.
    "crates/ai/core",
    "crates/ai/gateway",
    "crates/auth/oidc",
    "crates/auth/oauth2",
    "crates/auth/mfa",
    "crates/auth/webauthn",
    "crates/cache/redis",
    "crates/queue/nats",
    "crates/queue/rabbitmq",
    "crates/queue/kafka",
    # Payment domain group: ports + per-provider protocol adapters + durability.
    "crates/payment/core",
    "crates/payment/stripe",
    "crates/payment/alipay",
    "crates/payment/wechatpay",
    "crates/payment/paypal",
    "crates/payment/adyen",
    "crates/payment/square",
    # ORM boundary group: Web/ORM adapters live here, never in core/umbrella.
    # Outbox group: transactional-outbox starter over rust-ef.
    # Transport group: optional non-hyper listener backends (2.9 transport port).
    "crates/push/apns",
    "crates/push/fcm",
    "crates/transport/h3",
    "crates/client",
    # Non-published test harnesses live outside `crates/`: `crates/` is the
    # published framework surface only. Enforced by
    # scripts/check-crate-layout.py.
    "testing/alloc-probe",
    "testing/contract-tests",
    "testing/load-probe",
]

[workspace.lints.rust]
unsafe_code = "forbid"

# cargo-semver-checks policy (CI `semver` job). Crates opt in with
# `[lints] workspace = true` in their own Cargo.toml.
#
# `constructible_struct_adds_field` is allowed for three documented cases:
#
# 1. Config sections (`ServerSection`, `JwtSection`, `IdempotencySection`, …) are
#    serde-bound DTOs: the documented construction path is `Default` +
#    appsettings/`APP__` overrides, so adding a knob is additive for that usage.
#    They become `#[non_exhaustive]` in the next breaking release window, after which
#    this part of the exception can be removed.
# 2. 2.8.0: `IdempotentResponse` gains `headers` (the replayable response headers
#    of a cached response), which breaks struct-literal construction only.
#    CHANGELOG `[2.8.0]` -> Breaking documents the migration for custom
#    `IIdempotencyStore` implementations; the response-store path is the only
#    documented constructor. Revisit with the same next-breaking-release window.
# 3. 2.9.1: `EmailMessage` gains optional `from` / `reply_to` / `headers`
#    (upstream feedback §7). The documented construction path is `new(..)` plus
#    the `with_*` builders; only struct-literal construction breaks. CHANGELOG
#    `[2.9.1]` -> Breaking and `docs/design/compatibility.md` §3 record it.
#
# 2.8.0 also marks the idempotency value types `#[non_exhaustive]`
# (`IdempotentResponse`, `IdempotencyLease`, `IdempotencyBegin`) so new state /
# metadata can be added without another breaking release. That is flagged by
# `struct_marked_non_exhaustive` / `enum_marked_non_exhaustive`; both are allowed
# here for the same documented reason and reviewed with the next breaking release. The
# migration is mechanical: construct `IdempotentResponse` with `::new(..)` +
# `.with_headers(..)`, `IdempotencyLease` with `::new(..)`, and add a wildcard
# arm to `match` on `IdempotencyBegin`.
#
# Structs that must stay literal-constructible (e.g. `ProblemDetails`) are
# pinned by `api_stability_test`.
[workspace.metadata.cargo-semver-checks.lints]
constructible_struct_adds_field = "allow"
struct_marked_non_exhaustive = "allow"
enum_marked_non_exhaustive = "allow"

[workspace.package]
version = "2.9.4"
edition = "2021"
rust-version = "1.95"
license = "MIT"
authors = ["Start"]
homepage = "https://rust-framework.github.io/rust-webx/"
repository = "https://github.com/Rust-Framework/rust-webx"
documentation = "https://docs.rs/rust-webx"
description = "rust-webx - A Rust WebApi framework inspired by ASP.NET Core, built on DI + Mediator pattern"

[workspace.dependencies]
# Internal crates
rust-webx-core = { version = "=2.9.4", path = "crates/core" }
rust-webx-host = { version = "=2.9.4", path = "crates/host" }
rust-webx-engine = { version = "=2.9.4", path = "crates/engine" }
rust-webx-macros = { version = "=2.9.4", path = "crates/macros" }
rust-webx = { version = "=2.9.4", path = "crates/webx" }
rust-webx-spa = { version = "=2.9.4", path = "crates/spa" }
rust-webx-build = { version = "=2.9.4", path = "crates/build" }
rust-webx-openapi = { version = "=2.9.4", path = "crates/openapi" }
rust-webx-outbox = { version = "=2.9.4", path = "crates/outbox" }
rust-webx-ai = { version = "=2.9.4", path = "crates/ai/core" }
rust-webx-oidc = { version = "=2.9.4", path = "crates/auth/oidc" }
rust-webx-oauth2 = { version = "=2.9.4", path = "crates/auth/oauth2" }
rust-webx-mfa = { version = "=2.9.4", path = "crates/auth/mfa" }
rust-webx-webauthn = { version = "=2.9.4", path = "crates/auth/webauthn" }
rust-webx-client = { version = "=2.9.4", path = "crates/client" }
rust-webx-redis = { version = "=2.9.4", path = "crates/cache/redis" }
rust-webx-nats = { version = "=2.9.4", path = "crates/queue/nats" }
rust-webx-rabbitmq = { version = "=2.9.4", path = "crates/queue/rabbitmq" }
rust-webx-kafka = { version = "=2.9.4", path = "crates/queue/kafka" }
rust-webx-ai-gateway = { version = "=2.9.4", path = "crates/ai/gateway" }
# Payment domain group (opt-in; the umbrella never links these).
rust-webx-pay = { version = "=2.9.4", path = "crates/payment/core" }
rust-webx-pay-stripe = { version = "=2.9.4", path = "crates/payment/stripe" }
rust-webx-pay-alipay = { version = "=2.9.4", path = "crates/payment/alipay" }
rust-webx-pay-wechatpay = { version = "=2.9.4", path = "crates/payment/wechatpay" }
rust-webx-pay-paypal = { version = "=2.9.4", path = "crates/payment/paypal" }
rust-webx-pay-adyen = { version = "=2.9.4", path = "crates/payment/adyen" }
rust-webx-pay-square = { version = "=2.9.4", path = "crates/payment/square" }

# ORM boundary (opt-in; core/umbrella never link rust-ef).
# Transactional outbox starter (opt-in; own crate group).
# Optional non-hyper listener backends (opt-in; core/umbrella never link quinn/h3).
rust-webx-h3 = { version = "=2.9.4", path = "crates/transport/h3" }
# Push provider adapters (opt-in; core/host/umbrella never link a provider SDK).
rust-webx-apns = { version = "=2.9.4", path = "crates/push/apns" }
rust-webx-fcm = { version = "=2.9.4", path = "crates/push/fcm" }



# DI framework (crates.io — no local path required)
# Baseline is rust-dix 1.1 (`From<RdiError> for AppError`); the 1.0 range admits it.
rust-dix = "1.0"
# Shared contract layer (error carrier, pagination/cursor/OperationResult).
# 2.9.1 re-exports these types; the 2.9.x definitions were deleted.
rust-core = "0.1"
rust-dix-macros = "1.0"

# rust-ef ORM (rust-ef 2.6+, paired/verified with rust-ef 2.9.1 in this release;
# rust-dix 1.1 integration via add_dbcontext + owned resolution).
# Keep the `"2.6"` semver range: it admits 2.9.x, and the release order is
# rust-ef 2.9.1 first, then rust-webx 2.9.x. Do not tighten it to `=2.9`, which
# would make the lockfile unresolvable before the ORM release is on crates.io.
# rust-ef is Web-agnostic (no `webx` feature and no dependency on rust-webx);
# applications map EFError at their boundary (reference adapters: examples/adapters/*/ef).
rust-ef = "2.6"
rust-ef-sqlite = "2.6"
# Optional providers for rust-webx-idempotency-ef's env-driven real-database idempotency
# tests (`--features postgres,mysql`); never pulled into a default build.
rust-ef-postgres = "2.6"
rust-ef-mysql = "2.6"

# External dependencies
arc-swap = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-tokio"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
# Documentation bundle uploads (docbit admin): archive extraction.
zip = { version = "9", default-features = false, features = ["deflate"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-util = { version = "0.7", features = ["io"] }
# WebSocket (RFC 6455) framing for the host session layer; the engine only
# transports the upgraded byte stream.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake", "stream"] }
multer = "3"
mime_guess = "2"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
data-encoding = "2"
# Embedded static assets: brotli at build time, decoded on demand at runtime.
brotli = "9"
brotli-decompressor = "6"
tempfile = "3"
httpdate = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Field-path-aware JSON binding for real-time request frames.
serde_path_to_error = "0.1"
thiserror = "2"
inventory = "0.3"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
tracing = "0.1"
jsonwebtoken = "9"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
# Payment protocol adapters: request signing (Stripe/Alipay/WeChat/Adyen/Square),
# X.509 platform certificates (WeChat, Alipay cert mode) and Alipay cert SNs.
rsa = { version = "0.10", features = ["pkcs1v15"] }
# EC signing (JWT ES256 signing, WebAuthn): P-256 key parsing and SEC1 points.
p256 = { version = "0.14", features = ["ecdsa"] }
aes-gcm = "0.10"
x509-cert = { version = "0.2", features = ["pem"] }
der = "0.7"
md-5 = "0.10"
percent-encoding = "2"
url = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
rustls-pki-types = { version = "1", features = ["std"] }
webpki-roots = "1"
zeroize = { version = "1", features = ["alloc"] }
criterion = "0.5"
ctrlc = "3.4"
# Adapter drivers (2.5-7 starter family). Each adapter crate owns the driver
# dependency; the umbrella stays free of broker SDKs.
redis = { version = "0.32", default-features = false, features = ["tokio-rustls-comp", "connection-manager", "keep-alive"] }
async-nats = { version = "0.53", default-features = false, features = ["ring"] }
lapin = { version = "4.12", default-features = false, features = ["tokio", "rustls"] }
# Pure-Rust Kafka client: no C toolchain/librdkafka requirement.
rskafka = { version = "0.6", default-features = false, features = ["compression-gzip"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# Keep unwinding: the host catches panics at the request boundary and turns
# them into 500 responses. `panic = "abort"` would defeat that isolation and
# let one bad handler kill the process.

# 閳光偓閳光偓 Dev/test build hygiene 閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓閳光偓
# Windows MSVC emits one .pdb per linked binary, and with the default
# `debug = 2` on *every* dependency a single integration-test binary needs
# ~200 MB (rust-webx full `cargo test --workspace` produced >100 GB of
# stale artifacts in target/debug over a couple of months).
#
# Keep full debug info for workspace crates (stepping through framework code
# still works) but drop it for third-party deps: their type/line tables are
# what gets copied into every test binary's .pdb.
[profile.dev.package."*"]
debug = false

[profile.test.package."*"]
debug = false

# Workspace crates keep line tables (file:line in backtraces) without the
# full type information that dominates MSVC .pdb size.
[profile.dev]
debug = "line-tables-only"
# Incremental compilation is the other space hog: every source change creates
# a new session directory under target/debug/incremental (~40 GB observed).
# Opt back in for a heavy edit cycle with CARGO_PROFILE_DEV_INCREMENTAL=true.
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.bench]
incremental = false
