[workspace]
resolver = "2"

members = [
    "crates/rust-webapp-core",
    "crates/rust-webapp-host",
    "crates/rust-webapp-macros",
    "crates/rust-webapp",
    "crates/rust-webapp-spa",
    "crates/rust-webapp-openapi",
    "demo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Start"]
homepage = "https://gitcode.com/rf2026/rust-webapp"
repository = "https://gitcode.com/rf2026/rust-webapp"
documentation = "https://docs.rs/rust-webapp"
description = "rust-webapp — A Rust WebApi framework inspired by ASP.NET Core, built on DI + Mediator pattern"

[workspace.dependencies]
# Internal crates
rust-webapp-core = { version = "0.1.0", path = "crates/rust-webapp-core" }
rust-webapp-host = { version = "0.1.0", path = "crates/rust-webapp-host" }
rust-webapp-macros = { version = "0.1.0", path = "crates/rust-webapp-macros" }
rust-webapp = { version = "0.1.0", path = "crates/rust-webapp" }
rust-webapp-spa = { version = "0.1.0", path = "crates/rust-webapp-spa" }
rust-webapp-openapi = { version = "0.1.0", path = "crates/rust-webapp-openapi" }

# DI framework
rust-dicore = { path = "../rust-di/crates/rust-dicore", version = "0.2.6" }
rust-dicore-macros = { path = "../rust-di/crates/rust-dicore-macros", version = "0.2.6" }

# External dependencies
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
inventory = "0.3"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
tracing = "0.1"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4"] }
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"
criterion = "0.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
