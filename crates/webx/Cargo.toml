[package]
name = "rust-webx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "rust-webx — A Rust WebApi framework inspired by ASP.NET Core"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../../README.md"
keywords = ["web", "http", "async", "framework", "aspnet-core"]
categories = ["web-programming", "asynchronous"]

# Umbrella library name (`use webx::...`); package stays `rust-webx`.
[lib]
name = "webx"

[dependencies]
rust-webx-core.workspace = true
rust-webx-host.workspace = true
rust-webx-client.workspace = true
rust-webx-macros.workspace = true
rust-webx-spa.workspace = true
rust-webx-openapi.workspace = true
rust-dix.workspace = true
rust-dix-macros.workspace = true
async-trait.workspace = true
tokio.workspace = true
hyper.workspace = true
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true
inventory.workspace = true
jsonwebtoken.workspace = true

[features]
default = ["password-argon2"]
testing = ["rust-webx-host/testing"]
password-argon2 = ["rust-webx-host/password-argon2"]

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
rustls.workspace = true
futures-util = { workspace = true, features = ["sink"] }
proptest = "1"
rust-webx-engine.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
http.workspace = true
tokio = { workspace = true, features = ["macros", "net", "io-util", "rt-multi-thread", "time"] }
tokio-tungstenite = { workspace = true, features = ["connect"] }
trybuild = "1"

[lints]
workspace = true
