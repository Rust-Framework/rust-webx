[workspace]
resolver = "2"

members = [
    "crates/lrwf-core",
    "crates/lrwf-http",
    "crates/lrwf-macros",
    "crates/lrwf",
    "crates/lrwf-web",
    "crates/lrwf-openapi",
    "demo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Start"]
repository = "https://gitcode.com/rf2026/lrwf"
description = "LRWF — A Rust WebApi framework inspired by ASP.NET Core, built on DI + Mediator pattern"

[workspace.dependencies]
# Internal crates
lrwf-core = { path = "crates/lrwf-core" }
lrwf-http = { path = "crates/lrwf-http" }
lrwf-macros = { path = "crates/lrwf-macros" }
lrwf = { path = "crates/lrwf" }
lrwf-web = { path = "crates/lrwf-web" }
lrwf-openapi = { path = "crates/lrwf-openapi" }

# External dependencies
lrdi = "0.2.6"
lrdi-macros = "0.2.6"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
inventory = "0.3"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
tracing = "0.1"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4"] }
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"
criterion = "0.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
