name: Publish to crates.io

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Resolve tag version
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # A red commit must never reach crates.io: publication is irreversible
      # (only yank is possible). The preflight mirrors the CI `lint`/`docs`
      # gates in addition to the full workspace test.
      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check docs consistency
        run: bash scripts/check-docs.sh

      - name: Check publish order
        # Every publishable crate appears once in both publish paths, with
        # dependencies before dependents; a dropped crate would publish nothing
        # while the workflow stayed green.
        run: python3 scripts/check-publish-order.py

      - name: Internal version pins
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          echo "workspace version: $version"
          if grep 'path = "crates/' Cargo.toml | grep -qv "version = \"=$version\""; then
            echo "internal crates must be pinned to =$version:"
            grep 'path = "crates/' Cargo.toml | grep -v "version = \"=$version\"" || true
            exit 1
          fi

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build documentation (warnings as errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      - name: Verify the tagged commit
        run: cargo test --workspace --locked --no-fail-fast

      - name: Publish crates (dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TAG_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CRATES_IO_TOKEN / CARGO_REGISTRY_TOKEN secret is not set."
            exit 1
          fi

          # crates.io serves a sparse index; publication is asynchronous, so a
          # dependent is packaged only after its dependencies appear there. The
          # polling helpers are shared with `publish.sh`
          # (`scripts/crates-index.sh`) so the two release paths cannot drift.
          . scripts/crates-index.sh

          # Publish order: dependencies must appear before their dependents.
          CRATES="rust-webx-macros rust-webx-core rust-webx-engine rust-webx-client rust-webx-ef rust-webx-ai rust-webx-ai-ef rust-webx-build rust-webx-spa rust-webx-openapi rust-webx-host rust-webx-auth-ef rust-webx-mfa rust-webx-webauthn rust-webx rust-webx-outbox-ef rust-webx-oauth2 rust-webx-oidc rust-webx-redis rust-webx-nats rust-webx-rabbitmq rust-webx-kafka rust-webx-ai-gateway rust-webx-pay rust-webx-pay-stripe rust-webx-pay-alipay rust-webx-pay-wechatpay rust-webx-pay-paypal rust-webx-pay-adyen rust-webx-pay-square rust-webx-pay-ef rust-webx-h3"
          metadata="$(cargo metadata --no-deps --format-version 1)"

          # The tag must match every crate version. Skipping mismatches would
          # leave the workflow green with nothing published (e.g. a mistyped
          # tag), hiding a failed release behind a green run.
          for name in $CRATES; do
            version="$(printf '%s' "$metadata" \
              | jq -r --arg n "$name" '.packages[] | select(.name==$n) | .version')"
            if [ "$version" != "${TAG_VERSION}" ]; then
              echo "::error::$name has version ${version}, but the tag is v${TAG_VERSION}"
              exit 1
            fi
          done

          for name in $CRATES; do
            version="${TAG_VERSION}"

            # Re-running the workflow for an existing version is a no-op, not a
            # failure: a partial publish can be resumed by re-running the job.
            if index_has "$name" "$version"; then
              echo "::notice::$name $version is already published — skipping"
              continue
            fi

            echo "::group::Publishing $name@$version"
            cargo publish -p "$name" --token "${CARGO_REGISTRY_TOKEN}"
            echo "::endgroup::"
            wait_for_index "$name" "$version"
          done