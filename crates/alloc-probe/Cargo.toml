[package]
name = "alloc-probe"
version = "0.0.0"
edition = "2021"
publish = false
description = "Allocation probe for the rust-webx hot path (development tool, not published)"

[[bin]]
name = "alloc-probe"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
rust-webx = { path = "../webx" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
