name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      rust_ef_ref:
        description: "rust-ef git ref to pair against (empty = skip the pairing job)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
            examples/adapters/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run tests
        # `--locked` keeps the committed lockfile authoritative: a stale
        # Cargo.lock fails here instead of being rewritten by the runner. The
        # reference adapters are a separate (unpublished) workspace with their
        # own lockfile, so they need their own invocation.
        run: |
            cargo test --workspace --locked --no-fail-fast
            cargo test --workspace --manifest-path examples/adapters/Cargo.toml --locked --no-fail-fast

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
            examples/adapters/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check docs consistency
        run: bash scripts/check-docs.sh

      - name: Check crate ownership layout
        # crates/ is a closed taxonomy (framework set + ai/auth/cache/queue
        # groups) and framework crates may not depend on domain adapters.
        run: bash scripts/check-crate-layout.sh

      - name: Runtime crates stay independent of rust-ef
        # Feedback §37: no webx ↔ ef edge; only opt-in starter crates may link
        # both. This fails the PR that leaks an ORM dependency into the core
        # feature graph instead of discovering it at release time.
        run: bash scripts/check-core-isolation.sh

      - name: Check publish order
        # Every publishable crate must appear once in both publish paths, with
        # dependencies before dependents (a dropped crate would publish nothing
        # on a tag while the workflow stays green).
        run: python3 scripts/check-publish-order.py

      - name: Validate local broker compose
        # Client-side validation only: no Docker engine is required, so this
        # catches drift between docker-compose.brokers.yml and the adapter
        # integration job in PR CI.
        run: docker compose -f docker-compose.brokers.yml config > /dev/null

      - name: Run Clippy
        run: |
            cargo clippy --workspace --all-targets -- -D warnings
            cargo clippy --workspace --manifest-path examples/adapters/Cargo.toml --all-targets -- -D warnings

      # Internal crates are released in lockstep; exact pins keep a consumer
      # from resolving a mixed set (e.g. umbrella 2.0 + host 2.1).
      - name: Internal version pins
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          echo "workspace version: $version"
          if grep 'path = "crates/' Cargo.toml | grep -qv "version = \"=$version\""; then
            echo "internal crates must be pinned to =$version:"
            grep 'path = "crates/' Cargo.toml | grep -v "version = \"=$version\"" || true
            exit 1
          fi

  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup ships with the ubuntu runner; avoid depending on an action tag for
      # a fixed toolchain version.
      - name: Install MSRV toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Check workspace on MSRV
        run: cargo +1.95.0 check --workspace --locked

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        # Prebuilt release binary with checksum verification,
        # `cargo install cargo-audit --locked` compiles the tool on every run.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit the root workspace lockfile
        run: cargo audit

      # `examples/adapters/` is an independent (unpublished) workspace with its
      # own Cargo.lock: the root audit never reads it, yet it resolves the ORM
      # and database provider crates the framework itself must not depend on.
      - name: Audit the examples/adapters lockfile
        run: cargo audit --file examples/adapters/Cargo.lock

  # Supply-chain ratchet for dependency forks. `cargo tree -d` shows every
  # crate that resolves in more than one version; a new split doubles the audit
  # surface and the semver contracts a consumer inherits. The current set is
  # pinned in scripts/dependency-duplicates.baseline.txt: a new group fails the
  # job, a group that collapses is reported so the baseline can be tightened.
  # Only manifests are resolved (no compilation).
  dedup:
    name: Dependencies (duplicate versions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
          key: ${{ runner.os }}-cargo-dedup-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-dedup-

      - name: Duplicate crates (informational)
        # `cargo tree -d` also prints a package once per dependency kind it is
        # reached through, so its line count is larger than the set of crates
        # that genuinely resolve in two versions. The gate below uses that set.
        run: cargo tree --workspace -d --locked

      - name: Enforce the duplicate baseline
        # Reads `cargo metadata --locked` (same package set as `cargo tree -d`,
        # but host-independent, so one baseline works on every runner).
        run: python3 scripts/check-dependency-dedup.py

  # `cargo test --workspace` exercises each crate with its default features; a
  # combination that only exists when every opt-in feature is enabled would
  # stay uncompiled (and untested) until a consumer turns it on. This job runs
  # the full workspace suite on linux with `--all-features`; the `test` matrix
  # keeps the default-feature run on all three OSes, and the features that need
  # external services run in `realdb` / `brokers`. That split is the documented
  # policy in docs/design/compatibility.md §2.
  features:
    name: Features (workspace --all-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-features-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-features-

      - name: Test every target with all features
        run: cargo test --workspace --all-features --locked --no-fail-fast

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Run coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --lcov --output-path coverage/lcov.info

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build documentation
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check feature matrix
        run: |
          cargo check -p rust-webx --all-features --locked
          cargo check -p rust-webx --no-default-features --locked

  benches:
    name: Benchmarks (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Router and pipeline benchmarks
        run: |
          # The production router and pipeline live in the engine; the host
          # bencher measures the 1.5 compatibility embedder that no request uses.
          cargo bench -p rust-webx-engine --bench router_bench -- --warm-up-time 1 --measurement-time 1
          cargo bench -p rust-webx-engine --bench pipeline_bench -- --warm-up-time 1 --measurement-time 1

  alloc:
    name: Allocation budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Compares the framework against a bare-hyper floor measured in the same
      # window; the gate is the *framework tax*, not an absolute total (the
      # floor depends on the hyper version). See docs/design/alloc-budget.md.
      - name: Measure framework allocation tax
        # Linux measures 12.42 (framework 18.43 / hyper 6.00) while the Windows
        # reference is 10.42; see docs/design/alloc-budget.md for the platform split.
        run: cargo run -p alloc-probe --release --locked -- compare 500 13

  semver:
    name: SemVer (vs v2.9.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - name: Check the public API against the previous release
        run: |
          for package in rust-webx-core rust-webx-engine rust-webx-host rust-webx; do
            cargo semver-checks --package "$package" --baseline-rev v2.9.1
          done

  realdb:
    name: Real databases (idempotency store)
    runs-on: ubuntu-latest
    # M6: the durable idempotency store's server-specific SQL (unique-key INSERT
    # race fallback, conditional UPDATE/DELETE, Unix-seconds TTL columns, binary
    # body) is only exercised against a real PostgreSQL/MySQL. The tests are
    # `#[ignore]`d and opt-in through the providers' env URLs.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rust_webx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: rust_webx_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
            examples/adapters/target/
          key: ${{ runner.os }}-cargo-realdb-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-realdb-
      - name: Idempotency store against PostgreSQL 16 / MySQL 8
        env:
          RUST_EF_PG_URL: postgres://test:test@127.0.0.1:5432/rust_webx_test
          RUST_EF_MYSQL_URL: mysql://root:test@127.0.0.1:3306/rust_webx_test
        run: cargo test --manifest-path examples/adapters/Cargo.toml -p rust-webx-idempotency-ef --features postgres,mysql --locked --tests -- --ignored

  # The adapter integration suites (Redis / NATS / RabbitMQ / Kafka) skip
  # themselves when their `WEBX_*_URL` is unset, so the default `cargo test`
  # matrix is green without a broker. A release must prove them against real
  # brokers: `scripts/test-brokers.sh` starts docker-compose.brokers.yml on the
  # runner, waits for the ports and runs the four adapter suites. The nightly
  # copy in `.github/workflows/stability.yml` stays as the longer soak.
  brokers:
    name: Broker adapters (redis/nats/rabbitmq/kafka)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-brokers-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-brokers-

      - name: Adapter integration against real brokers
        run: bash scripts/test-brokers.sh

  # N-2 source-compatibility gate: the same smoke app is compiled against the
  # previous-but-one published release (for 2.9.2 that is rust-webx 2.9.0) and
  # against the current workspace path. See docs/design/compatibility.md.
  upgrade:
    name: Upgrade smoke (N-2 = 2.9.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build against rust-webx 2.9.0 (N-2)
        run: cargo build --manifest-path testing/upgrade-smoke/stable/Cargo.toml
      - name: Build the same source against the current workspace
        run: cargo build --manifest-path testing/upgrade-smoke/current/Cargo.toml

  build:
    name: Build (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release
        run: cargo build --release --workspace

  docbit:
    name: Docbit (build + docs check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Git tracks only docs/rust-webx/ (native). Sibling slugs resolve at runtime in monorepo
      # dev or are copied into publish bundles at publish time from source repos.
      - name: Verify native docs (rust-webx)
        run: |
          test -f docs/rust-webx/INDEX.md || (echo "Missing docs/rust-webx — native handbook must be committed" && exit 1)
          test -f docs/rust-webx/INDEX.json || (echo "Missing docs/rust-webx/INDEX.json" && exit 1)

      - name: Build docbit-host
        run: cargo build --manifest-path examples/docbit/Cargo.toml -p docbit-host

      # 2.2-7: reference apps must use the framework security ports, not
      # hand-rolled JWT/bcrypt (the EF `map_ef` adapter is allowed: rust-ef
      # 2.5's `webx` feature targets rust-webx-core 1.x — see
      # docs/design/compatibility.md).
      - name: Reference apps use native auth ports
        run: |
          if grep -rnE '^\s*(use (jsonwebtoken|bcrypt)|jsonwebtoken\s*=|bcrypt\s*=)' \
              examples/docbit examples/dmbit --include='*.rs' --include='Cargo.toml'; then
            echo "reference apps must use ITokenIssuer/IPasswordHasher, not hand-written JWT/bcrypt"
            exit 1
          fi

  # Every reference app under examples/ is its own cargo workspace, so the root
  # `cargo test --workspace` and `examples/adapters/Cargo.toml` jobs never
  # compile them. Test each app workspace on its own so a broken sample fails
  # here. (`examples/adapters/` itself is covered by test/lint/realdb.)
  examples:
    name: Examples (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [docbit, dmbit, imbit]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            examples/${{ matrix.app }}/target/
          key: ${{ runner.os }}-cargo-examples-${{ matrix.app }}-${{ hashFiles('examples/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-examples-${{ matrix.app }}-

      - name: Test ${{ matrix.app }} workspace
        run: cargo test --workspace --no-fail-fast --manifest-path examples/${{ matrix.app }}/Cargo.toml

  # Optional cross-repo pairing gate (release order: rust-ef 2.9.0 first, then
  # rust-webx 2.9.0). Hosted runners cannot see a developer's local checkout, so
  # this job is inert unless explicitly configured:
  #   * repository variable RUST_EF_PATH  — an existing rust-ef checkout on a
  #     self-hosted runner;
  #   * repository variable RUST_EF_REPO (+ optional RUST_EF_REF), or the
  #     `rust_ef_ref` workflow_dispatch input — the job checks rust-ef out into
  #     .pairing/rust-ef itself.
  # Without configuration it prints a notice and skips the verification; a
  # normal PR is never blocked. See scripts/check-pairing-rust-ef.sh and the
  # evidence boundary in docs/design/compatibility.md.
  pairing:
    name: Pairing (rust-ef local)
    runs-on: ubuntu-latest
    steps:
      - name: Explain why pairing is skipped
        if: vars.RUST_EF_PATH == '' && vars.RUST_EF_REPO == '' && github.event.inputs.rust_ef_ref == ''
        run: |
          echo "::notice::Cross-repo pairing is opt-in. Set repository variable RUST_EF_PATH (self-hosted rust-ef checkout) or RUST_EF_REPO (+ RUST_EF_REF), or dispatch this workflow with rust_ef_ref, to build rust-webx against local rust-ef via scripts/check-pairing-rust-ef.sh."

      - name: Check out rust-webx
        if: vars.RUST_EF_PATH != '' || vars.RUST_EF_REPO != '' || github.event.inputs.rust_ef_ref != ''
        uses: actions/checkout@v4

      - name: Check out paired rust-ef
        if: vars.RUST_EF_PATH == '' && (vars.RUST_EF_REPO != '' || github.event.inputs.rust_ef_ref != '')
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.RUST_EF_REPO || 'Rust-Framework/rust-ef' }}
          ref: ${{ github.event.inputs.rust_ef_ref || vars.RUST_EF_REF || 'main' }}
          path: .pairing/rust-ef

      - name: Install Rust toolchain
        if: vars.RUST_EF_PATH != '' || vars.RUST_EF_REPO != '' || github.event.inputs.rust_ef_ref != ''
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve pairing checkout
        if: vars.RUST_EF_PATH != '' || vars.RUST_EF_REPO != '' || github.event.inputs.rust_ef_ref != ''
        run: |
          if [ -n "${{ vars.RUST_EF_PATH }}" ]; then
            echo "RUST_EF_PATH=${{ vars.RUST_EF_PATH }}" >> "$GITHUB_ENV"
          else
            echo "RUST_EF_PATH=$GITHUB_WORKSPACE/.pairing/rust-ef" >> "$GITHUB_ENV"
          fi

      - name: Verify pairing (check --locked + rust-webx-idempotency-ef tests)
        if: vars.RUST_EF_PATH != '' || vars.RUST_EF_REPO != '' || github.event.inputs.rust_ef_ref != ''
        run: bash scripts/check-pairing-rust-ef.sh
