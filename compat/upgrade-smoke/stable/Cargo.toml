[package]
name = "upgrade-smoke-stable"
version = "0.0.0"
edition = "2021"
publish = false

# N-2 (rust-webx 2.0.0) source-compatibility check.
[[bin]]
name = "upgrade-smoke"
path = "../src/main.rs"

[dependencies]
async-trait = "0.1"
rust-webx = "=2.0.0"
serde = { version = "1", features = ["derive"] }

# Pin the whole 2.0 set. `rust-webx 2.0.0`'s published manifest used caret
# ranges, so a fresh build would resolve host 2.1 — which removed the
# `webx_host::context` re-export the 2.0 umbrella still names. The 2.2+
# manifests use exact `=x.y.z` pins for internal crates to prevent this class of
# mixed-version resolution.
rust-webx-core = "=2.0.0"
rust-webx-host = "=2.0.0"
rust-webx-engine = "=2.0.0"
rust-webx-macros = "=2.0.0"
rust-webx-spa = "=2.0.0"
rust-webx-openapi = "=2.0.0"

# Standalone: this manifest must not join the framework workspace (it pins an
# older rust-webx release on purpose).
[workspace]
