# Local broker stack for the starter adapter integration tests.
#
# Mirrors the `broker-integration` job in .github/workflows/stability.yml so the
# env-gated tests can be run on a workstation:
#
#   docker compose -f docker-compose.brokers.yml up -d
#   WEBX_REDIS_URL=redis://127.0.0.1:6379 \
#   WEBX_NATS_URL=nats://127.0.0.1:4222 \
#   WEBX_RABBITMQ_URL=amqp://guest:guest@127.0.0.1:5672/%2f \
#   WEBX_KAFKA_BROKERS=127.0.0.1:9092 \
#     cargo test -p rust-webx-redis -p rust-webx-nats -p rust-webx-rabbitmq \
#                -p rust-webx-kafka --test integration -- --nocapture
#   docker compose -f docker-compose.brokers.yml down -v
name: rust-webx-brokers

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  nats:
    image: nats:2
    ports:
      - "4222:4222"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 20s

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test:
        [
          "CMD",
          "/opt/kafka/bin/kafka-topics.sh",
          "--bootstrap-server",
          "localhost:9092",
          "--list",
        ]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
