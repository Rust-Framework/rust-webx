[workspace]
resolver = "2"

members = [
    "crates/core",
    "crates/host",
    "crates/macros",
    "crates/webx",
    "crates/spa",
    "crates/openapi",
    "docbit/contracts",
    "docbit/domain",
    "docbit/handlers",
    "docbit/host",
    "dmbit/contracts",
    "dmbit/domain",
    "dmbit/handlers",
    "dmbit/host",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
authors = ["Start"]
homepage = "https://github.com/Rust-Framework/rust-webx"
repository = "https://github.com/Rust-Framework/rust-webx"
documentation = "https://docs.rs/rust-webx"
description = "rust-webx — A Rust WebApi framework inspired by ASP.NET Core, built on DI + Mediator pattern"

[workspace.dependencies]
# Internal crates
rust-webx-core = { version = "0.3.0", path = "crates/core" }
rust-webx-host = { version = "0.3.0", path = "crates/host" }
rust-webx-macros = { version = "0.3.0", path = "crates/macros" }
rust-webx = { version = "0.3.0", path = "crates/webx" }
rust-webx-spa = { version = "0.3.0", path = "crates/spa" }
rust-webx-openapi = { version = "0.3.0", path = "crates/openapi" }

# Docbit sub-crates
docbit-contracts = { version = "0.1.0", path = "docbit/contracts" }
docbit-domain = { version = "0.1.0", path = "docbit/domain" }
docbit-handlers = { version = "0.1.0", path = "docbit/handlers" }

# Dmbit sub-crates
dmbit-contracts = { version = "0.1.0", path = "dmbit/contracts" }
dmbit-domain = { version = "0.1.0", path = "dmbit/domain" }
dmbit-handlers = { version = "0.1.0", path = "dmbit/handlers" }

# DI framework (crates.io — no local path required)
rust-dix = "0.6"
rust-dix-macros = "0.6"

# rust-ef 1.5.1 ORM framework (rust-dix 0.6 integration via add_dbcontext + owned resolution)
rust-ef = "1.5.1"
rust-ef-sqlite = "1.5.1"
rust-ef-mysql = "1.5.1"

# External dependencies
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
inventory = "0.3"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
tracing = "0.1"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
rustls-pemfile = "2"
criterion = "0.5"
ctrlc = "3.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
