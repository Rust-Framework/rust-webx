[package]
name = "rust-webx-spa"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "rust-webx SPA: static file serving middleware"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../../README.md"
keywords = ["web", "spa", "static-files", "middleware"]
categories = ["web-programming"]

# Library name used by dependents (`use webx_spa::...`); package stays `rust-webx-spa`.
[lib]
name = "webx_spa"

[dependencies]
rust-webx-core.workspace = true
async-trait.workspace = true
inventory.workspace = true
brotli-decompressor.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Encoding side only: the round-trip and serving tests build the payloads the
# build script would have generated.
brotli.workspace = true
tokio.workspace = true
async-trait.workspace = true
