[package]
name = "rust-webx-outbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
description = "Transactional outbox for rust-webx events: worker-facing port, lease-based dispatcher with retry/backoff and dead-letter, plus an in-memory store (durable storage lives in the ecosystem)"
