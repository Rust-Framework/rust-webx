[workspace]
resolver = "2"

members = [
    "crates/core",
    "crates/host",
    "crates/macros",
    "crates/webx",
    "crates/spa",
    "crates/build",
    "crates/openapi",
    "docbit/contracts",
    "docbit/domain",
    "docbit/handlers",
    "docbit/host",
    "dmbit/contracts",
    "dmbit/domain",
    "dmbit/handlers",
    "dmbit/host",
]

[workspace.package]
version = "1.2.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
authors = ["Start"]
homepage = "https://github.com/Rust-Framework/rust-webx"
repository = "https://github.com/Rust-Framework/rust-webx"
documentation = "https://docs.rs/rust-webx"
description = "rust-webx 鈥?A Rust WebApi framework inspired by ASP.NET Core, built on DI + Mediator pattern"

[workspace.dependencies]
# Internal crates
rust-webx-core = { version = "1.2.0", path = "crates/core" }
rust-webx-host = { version = "1.2.0", path = "crates/host" }
rust-webx-macros = { version = "1.2.0", path = "crates/macros" }
rust-webx = { version = "1.2.0", path = "crates/webx" }
rust-webx-spa = { version = "1.2.0", path = "crates/spa" }
rust-webx-build = { version = "1.2.0", path = "crates/build" }
rust-webx-openapi = { version = "1.2.0", path = "crates/openapi" }

# Docbit sub-crates
docbit-contracts = { version = "0.1.0", path = "docbit/contracts" }
docbit-domain = { version = "0.1.0", path = "docbit/domain" }
docbit-handlers = { version = "0.1.0", path = "docbit/handlers" }

# Dmbit sub-crates
dmbit-contracts = { version = "0.1.0", path = "dmbit/contracts" }
dmbit-domain = { version = "0.1.0", path = "dmbit/domain" }
dmbit-handlers = { version = "0.1.0", path = "dmbit/handlers" }

# DI framework (crates.io 鈥?no local path required)
rust-dix = "1.0"
rust-dix-macros = "1.0"

# rust-ef ORM (rust-ef 2.3 / rust-dix 1.0 integration via add_dbcontext + owned resolution)
rust-ef = "2.3.0"
rust-ef-sqlite = "2.3.0"
rust-ef-mysql = "2.3.0"

# External dependencies
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["full"] }
bytes = "1"
# Documentation bundle uploads (docbit admin): archive extraction.
zip = { version = "9", default-features = false, features = ["deflate"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-util = { version = "0.7", features = ["io"] }
multer = "3"
mime_guess = "2"
sha2 = "0.10"
# Embedded static assets: brotli at build time, decoded on demand at runtime.
brotli = "9"
brotli-decompressor = "6"
tempfile = "3"
httpdate = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
inventory = "0.3"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
tracing = "0.1"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
rustls-pemfile = "2"
criterion = "0.5"
ctrlc = "3.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# 鈹€鈹€ Dev/test build hygiene 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
# Windows MSVC emits one .pdb per linked binary, and with the default
# `debug = 2` on *every* dependency a single integration-test binary needs
# ~200 MB (rust-webx full `cargo test --workspace` produced >100 GB of
# stale artifacts in target/debug over a couple of months).
#
# Keep full debug info for workspace crates (stepping through framework code
# still works) but drop it for third-party deps: their type/line tables are
# what gets copied into every test binary's .pdb.
[profile.dev.package."*"]
debug = false

[profile.test.package."*"]
debug = false

# Workspace crates keep line tables (file:line in backtraces) without the
# full type information that dominates MSVC .pdb size.
[profile.dev]
debug = "line-tables-only"
# Incremental compilation is the other space hog: every source change creates
# a new session directory under target/debug/incremental (~40 GB observed).
# Opt back in for a heavy edit cycle with CARGO_PROFILE_DEV_INCREMENTAL=true.
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.bench]
incremental = false
