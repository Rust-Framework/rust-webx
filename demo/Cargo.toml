[package]
name = "lrwf-demo"
version = "0.1.0"
edition = "2021"
description = "LRWF Demo — Best-practice cloud service project structure with lref ORM"

[dependencies]
lrwf = { path = "../crates/lrwf" }
lref = "0.3.2"
lref-provider-sqlite = "0.3"
lrdi = "0.2.6"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
inventory = "0.3"
bcrypt = "0.16"
tracing = "0.1"
