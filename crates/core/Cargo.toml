[package]
name = "rust-webx-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "rust-webx core traits: IRequest, IRequestHandler, IMiddleware, IHttpContext, IMediator, and more"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../../README.md"
keywords = ["web", "http", "async", "framework", "aspnet-core"]
categories = ["web-programming", "asynchronous"]

# Library name used by dependents (`use webx_core::...`); package stays `rust-webx-core`.
[lib]
name = "webx_core"

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_ignored = "0.1"
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "macros", "time", "io-util", "fs"] }
tokio-util.workspace = true
futures-util.workspace = true
rust-dix.workspace = true
rust-core.workspace = true
inventory.workspace = true
tracing.workspace = true
tempfile.workspace = true
zeroize.workspace = true
bytes.workspace = true
# TURN REST credentials (HMAC-SHA1) for the signaling control plane (2.4-1).
hmac.workspace = true
sha1.workspace = true
data-encoding.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true

# cargo-semver-checks: 2.9.1 adds `RateLimitRoute::Pattern` and
# `RateLimitSubject::Composite` (upstream feedback §5). A downstream exhaustive
# `match` on either enum must add a wildcard arm; the migration is recorded in
# CHANGELOG [2.9.1] -> Breaking and `docs/design/compatibility.md` §3. `Error`
# is no longer an enum in 2.9.1 (`too_many_requests` / `conflict_retryable` are
# `AppError` constructors), so it no longer contributes to this exception. Drop
# this allow once the semver baseline moves past v2.9.1.
[package.metadata.cargo-semver-checks.lints]
enum_variant_added = "allow"
