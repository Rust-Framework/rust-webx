[package]
name = "rust-webx-build"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "rust-webx build-script support: compile static files into the executable"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../../README.md"
keywords = ["web", "static-files", "embedded", "build-script"]
# `development-tools::build-utils`, not the bare `build-utils`: crates.io rejects
# unknown slugs, and a release cannot be republished once a crate is up.
categories = ["web-programming", "development-tools::build-utils"]

# Imported in build.rs as `webx::builder()` — same namespace as the app,
# separate compilation unit from the umbrella crate.
#
# `doc = false`: this library shares the name `webx` with the umbrella crate
# (`rust-webx`), so documenting both would collide on `doc/webx/`. This is a
# build-script helper with no runtime API to browse; its usage is documented
# in the crate docs above and in the production guide.
[lib]
name = "webx"
doc = false

[dependencies]
mime_guess.workspace = true
sha2.workspace = true
brotli.workspace = true

[dev-dependencies]
tempfile.workspace = true
